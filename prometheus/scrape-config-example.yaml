# Prometheus scrape configuration example for non-operator users.
#
# If you are running prometheus-operator (kube-prometheus-stack), use
# manifests/06-servicemonitor.yaml instead — that's the idiomatic
# path. This file is for users running a plain Prometheus with a
# static prometheus.yml / ConfigMap.
#
# Merge the two jobs below into your existing `scrape_configs:` list.
# After updating the ConfigMap, restart Prometheus:
#
#   kubectl rollout restart deployment <prometheus-deployment> -n monitoring
#   # or for the StatefulSet form:
#   kubectl rollout restart statefulset <prometheus-statefulset> -n monitoring

scrape_configs:

  # Job 1 — scrape the blackbox-exporter's own /metrics endpoint
  # (Go runtime, build info, the exporter's health).
  - job_name: blackbox-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - blackbox-exporter.monitoring.svc.cluster.local:9115

  # Job 2 — probe external URLs via the exporter's /probe endpoint.
  # The relabel chain rewrites the address so Prometheus scrapes the
  # exporter rather than the target itself, while preserving the
  # original URL as the `instance` label.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://example.com
          - https://www.google.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc.cluster.local:9115
